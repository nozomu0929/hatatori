<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ハタトリ — CTF学習支援</title>
<meta name="theme-color" content="#b94047">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <script type="module" crossorigin src="./assets/index-BRyrWtbz.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-C79kCDVs.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 512 512" class="logo" aria-hidden="true">
      <path d="M160 96v320" stroke="currentColor" stroke-width="30" stroke-linecap="round" fill="none"/>
      <path d="M160 116h196l-40 62 40 62H160z" fill="var(--accent)"/>
      <circle cx="160" cy="416" r="22" fill="var(--accent2)"/>
    </svg>
    <h1>ハタトリ</h1>
  </div>
  <p class="notice">
    <strong>学習・練習用</strong>／終了済み問題の復習用ツールです。
    開催中の競技での使用は、多くの大会規約で禁止されています。
  </p>
  <nav class="tabs" aria-label="画面切替">
    <button data-tab="learn" class="on">学ぶ</button>
    <button data-tab="analyze">解析する</button>
  </nav>
</header>

<main>
  <!-- ══ 学習 ══ -->
  <section id="learn">
    <div id="learn-body"></div>
  </section>

  <!-- ══ 解析 ══ -->
  <section id="analyze" hidden>
    <div id="drop" class="drop" tabindex="0" aria-label="ファイルを読み込む">
      <div class="drop-inner">
        <div class="drop-icon" aria-hidden="true">⤓</div>
        <p class="drop-title">ファイルをドロップ</p>
        <p class="drop-sub">タップしてファイルを選ぶこともできます</p>
        <input type="file" id="file" hidden>
      </div>
      <div class="drop-opts">
        <label for="format">フラグ書式（任意）</label>
        <input type="text" id="format" placeholder="例: hatatoriCTF{}  空欄なら自動判別" autocomplete="off" spellcheck="false">
      </div>
      <p class="privacy">解析は端末内で完結します。ファイルはどこにも送信されません。</p>
    </div>

    <div id="status" class="status" hidden></div>

    <div id="result" class="result" hidden>
      <div class="result-head">
        <div>
          <h2 id="fname"></h2>
          <p id="fmeta" class="dim"></p>
        </div>
        <div class="modes" role="tablist" aria-label="表示モード">
          <button role="tab" data-mode="hint" class="on">ヒント</button>
          <button role="tab" data-mode="full">全解説</button>
          <button role="tab" data-mode="tree">構造</button>
        </div>
      </div>
      <div id="answer" class="answer"></div>
      <div id="body"></div>
    </div>
  </section>
</main>

</body>
</html>
